name: Install Trivy
description: Install a pinned Trivy release and verify its SHA-256 before use (no third-party action involved).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TRIVY_VERSION: "0.76.1"
        TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
      run: |
        set -euo pipefail
        archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -fsSL -o "/tmp/${archive}" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
        echo "${TRIVY_SHA256}  /tmp/${archive}" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "/tmp/${archive}" -C "$HOME/.local/bin" trivy
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
