name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TERRAFORM_VERSION: "1.9.8"
  KIND_VERSION: "v0.31.0"
  CLUSTER: tfk8s-lab
  IMAGE: labapi:ci

jobs:
  app:
    name: app (ruff, pytest, hadolint, image)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: ruff (lint)
        working-directory: app
        run: ruff check .

      - name: ruff (format check)
        working-directory: app
        run: ruff format --check .

      - name: pytest
        working-directory: app
        run: pytest

      - name: Install hadolint (pinned release, checksum verified)
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
        run: |
          curl -fsSL -o /tmp/hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/hadolint "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: hadolint
        run: hadolint app/Dockerfile

      - name: Build image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$IMAGE" app

      - name: Container runs as non-root with a read-only root filesystem
        run: |
          docker run -d --name labapi-ro --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e DNS_STUB=true -p 18080:8080 "$IMAGE"
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          uid="$(docker exec labapi-ro python -c 'import os; print(os.getuid())')"
          echo "uid=${uid}"
          test "${uid}" = "10001"
          curl -fsS "http://127.0.0.1:18080/api/dns?domain=example.com"
          docker logs labapi-ro
          docker rm -f labapi-ro

  iac:
    name: iac (fmt, validate, tflint, trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: tflint
        run: tflint --chdir=terraform --recursive

      - uses: ./.github/actions/install-trivy

      # Note: Trivy has no checks for the kubernetes_* Terraform resources, so this mostly guards
      # against future non-Kubernetes resources. The Kubernetes objects are scanned in the e2e job.
      - name: trivy config (terraform and Dockerfile, fail on HIGH/CRITICAL)
        run: |
          trivy config --disable-telemetry --severity HIGH,CRITICAL --exit-code 1 terraform
          trivy config --disable-telemetry --severity HIGH,CRITICAL --exit-code 1 app

  e2e:
    name: e2e (kind + terraform apply + smoke test)
    needs: [app, iac]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KUBE_CONTEXT: kind-tfk8s-lab
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          cluster_name: ${{ env.CLUSTER }}
          config: kind/kind-config.yaml
          wait: 120s

      - name: Build image and load it into kind
        run: |
          docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$IMAGE" app
          kind load docker-image "$IMAGE" --name "$CLUSTER"

      - name: terraform init
        run: terraform -chdir=terraform init -input=false

      - name: terraform apply
        id: apply
        run: |
          terraform -chdir=terraform apply -input=false -auto-approve \
            -var "kube_context=${KUBE_CONTEXT}" \
            -var "image=${IMAGE}" \
            -var "app_version=ci" \
            -var "dns_stub=true"

      - name: Wait for rollout
        run: kubectl --context "$KUBE_CONTEXT" -n devops-lab rollout status deployment/labapi --timeout=120s

      - name: Verify cluster objects
        run: CONTEXT="$KUBE_CONTEXT" scripts/verify-cluster.sh

      - name: Smoke test through kubectl port-forward
        run: CONTEXT="$KUBE_CONTEXT" scripts/smoke-test.sh

      - uses: ./.github/actions/install-trivy

      - name: trivy config on the live Deployment and Service (fail on HIGH/CRITICAL)
        run: |
          mkdir -p /tmp/rendered
          kubectl --context "$KUBE_CONTEXT" -n devops-lab get deployment labapi -o yaml > /tmp/rendered/deployment.yaml
          kubectl --context "$KUBE_CONTEXT" -n devops-lab get service labapi -o yaml > /tmp/rendered/service.yaml
          trivy config --disable-telemetry --severity HIGH,CRITICAL --exit-code 1 /tmp/rendered

      - name: terraform plan shows no drift after apply
        run: |
          terraform -chdir=terraform plan -input=false -detailed-exitcode \
            -var "kube_context=${KUBE_CONTEXT}" \
            -var "image=${IMAGE}" \
            -var "app_version=ci" \
            -var "dns_stub=true"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" -n devops-lab get all,hpa,pdb,networkpolicy,events || true
          kubectl --context "$KUBE_CONTEXT" -n devops-lab describe deployment labapi || true
          kubectl --context "$KUBE_CONTEXT" -n devops-lab logs -l app.kubernetes.io/name=labapi --tail=100 || true

      - name: terraform destroy
        if: always() && steps.apply.outcome != 'skipped'
        run: |
          terraform -chdir=terraform destroy -input=false -auto-approve \
            -var "kube_context=${KUBE_CONTEXT}" \
            -var "image=${IMAGE}" \
            -var "app_version=ci" \
            -var "dns_stub=true"

      - name: Namespace is gone after destroy
        run: |
          for _ in $(seq 1 30); do
            if ! kubectl --context "$KUBE_CONTEXT" get namespace devops-lab >/dev/null 2>&1; then
              echo "namespace devops-lab removed"
              exit 0
            fi
            sleep 2
          done
          echo "namespace devops-lab still exists"
          exit 1
